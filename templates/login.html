{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block auth_content %}
<div class="login-wrap">
    <div class="login-card">
        <div class="login-brand">
            <span class="brand-icon">☁</span>
            <h1>Cloud Library</h1>
        </div>
        <p class="subtitle">Management System &middot; sign in to continue</p>
        <form method="POST">
            <div class="form-group" style="margin-bottom:16px;">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>
        <div class="form-actions" style="margin-top:16px; justify-content:center;">
            <a href="{{ url_for('signup') }}" class="btn btn-secondary">Create Member Account</a>
        </div>
        <div class="login-hint">
            Admin: <strong>admin</strong> / <strong>admin123</strong><br>
            Member: <strong>mem001</strong> / <strong>member123</strong>
        </div>
    </div>
</div>
{% endblock %}
