{% extends "base.html" %}
{% block title %}{{ 'Edit Book' if book else 'Add Book' }}{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1>{{ 'Edit Book' if book else 'Add New Book' }}</h1>
        <p>{{ 'Update this catalog entry.' if book else 'Add a new title to the library catalog.' }}</p>
    </div>
</div>

<div class="panel" style="max-width: 640px;">
    <form method="POST">
        <div class="form-grid">
            <div class="form-group full">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" value="{{ book.title if book else '' }}" required>
            </div>
            <div class="form-group full">
                <label for="author">Author</label>
                <input type="text" id="author" name="author" value="{{ book.author if book else '' }}" required>
            </div>
            <div class="form-group">
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" name="isbn" value="{{ book.isbn if book else '' }}" placeholder="Optional">
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" name="category" value="{{ book.category if book else '' }}" placeholder="e.g. Technology">
            </div>
            <div class="form-group">
                <label for="copies">Total Copies</label>
                <input type="number" id="copies" name="copies" min="1" value="{{ book.total_copies if book else 1 }}" required>
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{{ 'Save Changes' if book else 'Add Book' }}</button>
            <a href="{{ url_for('books') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
