{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1>Profile</h1>
        <p>View your member details and keep contact information current.</p>
    </div>
</div>

<div class="panel" style="max-width: 700px;">
    <form method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label>Membership ID</label>
                <input type="text" value="{{ member.membership_id }}" disabled>
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" value="{{ member.name }}" disabled>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ member.email }}" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone" value="{{ member.phone or '' }}" placeholder="Optional">
            </div>
            <div class="form-group">
                <label for="current_password">Current Password</label>
                <input type="password" id="current_password" name="current_password" placeholder="Required only to change password">
            </div>
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" placeholder="Leave blank to keep current password">
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Profile</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
